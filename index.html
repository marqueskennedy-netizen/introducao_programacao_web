<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Cadastre o nome</h2>
    <imput type="text" id="nome" placeholder="Digite um nome">
    <button onclick="adcionar()">Adicionar</button>
    <button onclick="motrar()">Motrar Lista</button>

    <p id="resultado"></p>
    
    <script>
        let nomes =[];
        function aicionar(){
            let nome = document.getElementById("nome").value;
            if(nome !=""){
                nomes.push(nome);
                document.getElementById("nome").value= "";



            }
        }
        function mostrar(){
            let texto = "Nomes Cadastrados: <br>";
            for(let i=0; i<nome.lenght; i++){
                texto += nomes[i] + "<br>";  


        }
        document.getElementById("resultado").innerHTML = texto;
        }
    
</body>
</html>
